name: Android APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'URL of the running VivariumAI server (e.g. http://192.168.1.x:3000). Defaults to Android emulator localhost.'
        required: false
        default: 'http://10.0.2.2:3000'
        type: string
      release_tag:
        description: 'Git tag for the GitHub release (e.g. v0.1.0-alpha). Leave empty to skip release creation.'
        required: false
        default: 'v0.1.0-alpha'
        type: string

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      CAP_SERVER_URL: ${{ inputs.server_url }}
      DATABASE_URL: file:./vivarium.db

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Run web validation
        run: |
          npx playwright install --with-deps chromium
          npm run db:push
          npm run db:seed
          npm run lint
          npm run build
          npm run test:e2e -- --project=mobile-chrome

      - name: Generate Android project
        run: |
          if [ ! -d android ]; then
            npm run cap:add:android
          fi
          npm run cap:sync -- android

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vivarium-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: 'VivariumAI ${{ inputs.release_tag }} — Early Alpha'
          body: |
            ## VivariumAI Early Alpha APK

            This is an early alpha build for on-device testing.

            ### Setup
            1. Install the APK on your Android device (enable "Install from unknown sources" if prompted).
            2. On your computer, start the VivariumAI server:
               ```
               npm run db:push && npm run db:seed && npm start
               ```
            3. Find your computer's local IP address (e.g. `192.168.1.x`).
            4. For **Android Emulator** testing: the APK is pre-configured to connect to `${{ inputs.server_url }}`.
            5. For **physical device** testing: rebuild the APK via the workflow with your machine's IP as `server_url`.

            ### Notes
            - This is a debug build — not for production use.
            - The app requires a running VivariumAI Next.js server on your local network.
            - Minimum Android SDK: 24 (Android 7.0 Nougat).
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: false
